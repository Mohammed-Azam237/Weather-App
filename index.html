<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Merriweather+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="wrapper">
        <h1>WEATHER APP</h1>
        <div class="tab-container">
            <p class="tab" data-userWeather>Your Weather</p>
            <p class="tab" data-searchWeather>Search Weather</p>
        </div>

        <div class="weather-container">
            <!-- grant location wala cotainer banare -->
            <div class=" sub-container grant-location-container">
                <img src="./images/location.png" alt="" width="80" height="80" loading="lazy">
                <p>Grant location Access</p>
                <p>Allow Access to get Weather Information</p>
                <button class="btn" data-grantAccess>Grant Access</button>
            </div>
            <!-- search form banare ab jisme search karte jake  -->
            <form  class="form-container" data-searchForm>
                <input placeholder="Search For The City....." data-searchInput>
                <button class="btn" type="submit">
                    <img src="./images/search.png" alt="" width="20" height="20">
                </button>
            </form>
            <!-- loading screen ka container banare -->
            <div class=" sub-container loading-container">
                <img src="./images/loading.gif" alt="" width="150" height="150">
                <p>Loading</p>
            </div>
            <!-- ab yaha pe main jo bantana hai info show karna hai samjho used in both search aur apne wale me -->
            <div class=" sub-container user-info-container">
                <!-- city name and flag dynamically ara bolke sirf custom attribute diye -->
                <div class="name">
                    <p data-cityName></p>
                    <img data-countryIcon>
                </div>
                <!-- weather ka description,usk icon and temp kitna hai wo batare isme wo bhi dynamically -->
                <p data-weatherDesc></p>
                <img data-weatherIcon>
                <p data-temp></p>
                <!-- 3 cards-parameters -->
                <div class="parameter-container">
                    <!-- card-1 -->
                    <div class="parameter">
                        <img src="./images/wind.png" alt="">
                        <p>Windspeed</p>
                        <p data-windspeed></p>
                    </div>
                    <!-- card2 -->
                    <div class="parameter">
                        <img src="./images/humidity.png" alt="">
                        <p>humidity</p>
                        <p data-humidity></p>
                    </div>
                    <!-- card-3 -->
                    <div class="parameter">
                    <img src="./images/cloud.png" alt="">
                    <p>Clouds</p>
                    <p data-cloudiness></p>
                    </div>

                </div>
            </div>
        </div>
    </div>
    


    <script src="script.js"></script>
</body>
</html>
